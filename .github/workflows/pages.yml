# Publishes the client proposal (propuesta/) to GitHub Pages on every push to main.
# Link: https://viid21.github.io/Badadent-Website/
# One-time setup in GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy proposal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "propuesta/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own template: the deploy job starts only once the
  # uploaded artifact is available (a single job sometimes cannot find it yet).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: propuesta

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
